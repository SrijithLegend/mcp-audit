[project]
name = "mcp-audit"
version = "0.1.0"
description = "Differential exploit confirmation for MCP servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0,<3",
    "typer>=0.27.0",
]

[project.scripts]
mcp-audit = "mcp_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_audit"]
