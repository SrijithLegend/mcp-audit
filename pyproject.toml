[project]
name = "mcp-audit"
version = "0.1.0"
description = "Differential exploit confirmation for MCP servers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "security", "prompt-injection", "llm", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "anthropic>=1.0.0",
    "mcp>=2.2.0,<3",
    "typer>=0.27.0",
    "pydantic>=2",
    "rich>=13",
    # httpx2, not httpx: anthropic 1.x and mcp 2.x already ship it. Adding httpx
    # would install a second HTTP stack for nothing.
    "httpx2>=2",
]

[project.urls]
Homepage = "https://github.com/SrijithLegend/mcp-audit"
Issues = "https://github.com/SrijithLegend/mcp-audit/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14",
    "mypy>=1.13",
]

[project.scripts]
mcp-audit = "mcp_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits the real Anthropic API and spends money (deselected by default)",
    "gate: the Gate 1 fixture matrix; ~$5-10 of live calls. Ask before running.",
]
addopts = "-m 'not live and not gate'"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["cloud/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "B008",    # typer declares defaults by calling typer.Option/Argument
    "RUF001",  # our docs and messages use real em dashes
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"fixtures/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/mcp_audit"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
