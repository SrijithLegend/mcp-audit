name: deploy

on:
  push:
    branches: [main]      # -> staging
    tags: ["cloud-v*"]    # -> production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    # Staging on every green main, production only on a tag. Alembic runs as the Fly
    # release command, so migrations apply while the previous version still serves
    # (expand -> migrate -> contract).
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f662f9157 # v1.5
      - name: deploy api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config cloud/infra/fly.api.toml --dockerfile cloud/infra/Dockerfile.api --remote-only
      - name: deploy worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config cloud/infra/fly.worker.toml --dockerfile cloud/infra/Dockerfile.worker --remote-only
      - name: smoke the deployment
        env:
          BASE: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS "$BASE/readyz" > /dev/null; then echo "ready"; exit 0; fi
            sleep 5
          done
          echo "::error::the API never became ready"; exit 1

  web:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: cloud/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - run: npx vercel@latest deploy --yes --token "$VERCEL_TOKEN" ${{ startsWith(github.ref, 'refs/tags/') && '--prod' || '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
