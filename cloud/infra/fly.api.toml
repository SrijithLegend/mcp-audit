app = "mcp-audit-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.api"

[deploy]
  # Expand -> migrate -> contract: migrations run while the old version still serves.
  release_command = "alembic upgrade head"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 120

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/readyz"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]
