# Local development stack. Not production: production is Neon + Upstash (D10).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mcpaudit
      POSTGRES_PASSWORD: mcpaudit
      POSTGRES_DB: mcpaudit
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpaudit"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
